            {key:'tarot-minor',label:'真相',bg:'var(--tarot-bg)',c:'var(--tarot-c)'},
            {key:'guide',label:'指引',bg:'var(--guide-bg)',c:'var(--guide-c)'},
            {key:'issue',label:'議題',bg:'var(--issue-bg)',c:'var(--issue-c)'},
          ];
          const dtRow = `<div class="field-group"><div class="field-label">抽到的牌種</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${INFO_BTNS2.map(t=>`<button onclick="updateRoll(${r.id},'destinyCardType','${dt===t.key?'':t.key}');updateRoll(${r.id},'cardName','');updateRoll(${r.id},'tarotGroup','');updateRoll(${r.id},'guideGroup','');renderPhaseContent()" style="padding:6px 14px;border-radius:20px;border:1.5px solid ${dt===t.key?t.c:'var(--border)'};background:${dt===t.key?t.bg:'transparent'};color:${dt===t.key?t.c:'var(--text-muted)'};font-size:12px;cursor:pointer;">${t.label}</button>`).join('')}
            </div></div>`;
          const dtCardSel = ['issue','tarot','tarot-minor','guide'].includes(dt)
            ? renderInfoCardSel(r.id, dt, r.cardName, r.orientation, dt==='tarot-minor'?r.tarotGroup:r.guideGroup)
            : '';
          cardSel = dtRow + dtCardSel;
        }
        return `<div class="rule-note noble"><div class="rule-note-title">⭐ 貴人（受到幫助）</div>
          <div class="rule-note-body">其他玩家給你一張牌，你得到的是那張牌，不會增加貴人卡</div></div>
          <div class="field-group"><div class="field-label">幫助你的玩家</div>
            <select onchange="updateRoll(${r.id},'noblePerson',this.value)">
              <option value="">— 選擇玩家 —</option>
              ${players.filter(p=>p.id!==currentPlayerId).map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${r.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('')}
            </select>
          </div>
          <div class="field-group"><div class="field-label">得到的牌種</div>
            ${typeRow('nobleCardType', NOBLE_EXTRA)}
          </div>${cardSel}`;
      }

      // 放下：選手上哪張牌放下
      if (r.cellType === 'release') {
        const player = getPlayer();
        const phRolls = player ? player.phases[currentPhase] : [];
        // 手上的牌（不算這一輪自己選的放下）
        const hand = activeInfoRolls(phRolls, r.id).filter(roll => roll.cardName && roll.collapsed && roll.id !== r.id);
        const groupCount = {};
        hand.forEach(roll => { const g = cardGroupOf(roll); if (g) groupCount[g] = (groupCount[g]||0) + 1; });
        // 保底：探索/真相、議題、指引各留 1 張，該組只剩 1 張就不能放
        const canDrop = roll => { const g = cardGroupOf(roll); return !g || groupCount[g] > 1; };
        const dropable = hand.filter(canDrop);
        const locked = [...new Set(hand.filter(roll => !canDrop(roll)).map(cardGroupOf))];
        const { pending } = releaseCounts(phRolls.filter(roll => roll.id !== r.id));
        const cur = r.releasedCard && !dropable.some(roll => roll.cardName === r.releasedCard) ? r.releasedCard : '';
        return `<div class="rule-note release"><div class="rule-note-title">🍃 放下</div>
          <div class="rule-note-body">選一張手牌放下，執行一張放下卡${pending>0?`（目前待放下 ${pending} 張）`:'（目前沒有待執行的放下卡）'}</div></div>
          <div class="field-group"><div class="field-label">選擇要放下的牌</div>
            <select onchange="updateRoll(${r.id},'releasedCard',this.value)">
              <option value="">— 選擇 —</option>
              ${cur?`<option value="${cur}" selected disabled>${cur}（已不符合保底，請重選）</option>`:''}
              ${dropable.map(roll=>`<option value="${roll.cardName}" ${r.releasedCard===roll.cardName?'selected':''}>${roll.cardName}（${CELL_TYPES.find(c=>c.key===infoTypeOf(roll))?.label||''}）</option>`).join('')}
              ${dropable.length===0?'<option disabled>尚無可放下的牌</option>':''}
            </select>
            ${locked.length?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px;">${locked.map(g=>GROUP_LABEL[g]).join('、')}只剩 1 張，保底不能放下</div>`:''}
          </div>`;
      }

      // 命運之輪：選牌種
      if (r.cellType === 'destiny') {
        const cardType = r.destinyCardType || '';
        let cardSel = '';
        if (['issue','tarot','tarot-minor','guide'].includes(cardType)) {
          cardSel = renderInfoCardSel(r.id, cardType, r.cardName, r.orientation, cardType==='tarot-minor'?r.tarotGroup:r.guideGroup);
        }
        return `<div class="rule-note destiny"><div class="rule-note-title">🎡 命運之輪</div></div>
          <div class="field-group"><div class="field-label">抽到的牌種</div>
            ${typeRow('destinyCardType')}
          </div>${cardSel}`;
      }

      // 黃金格：選牌種
      if (r.cellType === 'golden') {
        const cardType = r.goldenCardType || '';
        let cardSel = '';
        if (['issue','tarot','tarot-minor','guide'].includes(cardType)) {
          cardSel = renderInfoCardSel(r.id, cardType, r.cardName, r.orientation, cardType==='tarot-minor'?r.tarotGroup:r.guideGroup);
        }
        return `<div class="rule-note golden"><div class="rule-note-title">✨ 黃金格</div></div>
          <div class="field-group"><div class="field-label">抽到的牌種</div>
            ${typeRow('goldenCardType')}
          </div>${cardSel}`;
      }
      return '';
    }

    if (r.cellType === 'noble') {
      return `<div class="rule-note noble"><div class="rule-note-title">⭐ 貴人格子</div>
        <div class="rule-note-body">領取貴人卡，擲貴人骰，依指示抽取牌卡給對方</div></div>
        <div class="field-group"><div class="field-label">幫助的玩家</div>
          <select onchange="updateRoll(${r.id},'noblePerson',this.value)">
            <option value="">— 選擇玩家 —</option>
            ${players.filter(p=>p.id!==currentPlayerId).map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${r.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('')}
          </select>
        </div>`;
    }

    if (r.cellType === 'release') {
      return `<div class="rule-note release"><div class="rule-note-title">🍃 放下格子</div>
        <div class="rule-note-body">領取一張放下卡，本階段結束前需放下等同張數的訊息牌</div></div>`;
    }

    if (r.cellType === 'destiny') {
      return `<div class="rule-note destiny"><div class="rule-note-title">🎡 命運之輪</div>
        <div class="rule-note-body">憑直覺抽一張訊息卡 → 所有人輪流擲骰 → 最大者得牌</div></div>`;
    }

    if (r.cellType === 'golden') {
      const INFO_BTNS = [
        {key:'tarot',      label:'探索',   bg:'var(--tarot-bg)',   c:'var(--tarot-c)'},
        {key:'tarot-minor',label:'真相',   bg:'var(--tarot-bg)',   c:'var(--tarot-c)'},
        {key:'guide',      label:'指引',   bg:'var(--guide-bg)',   c:'var(--guide-c)'},
        {key:'issue',      label:'議題',   bg:'var(--issue-bg)',   c:'var(--issue-c)'},
      ];
      const gt = r.goldenCardType || '';
      let cardSel = '';
      if (['issue','tarot','tarot-minor','guide'].includes(gt)) {
        cardSel = renderInfoCardSel(r.id, gt, r.cardName, r.orientation, gt==='tarot-minor'?r.tarotGroup:r.guideGroup);
      }
      return `<div class="rule-note golden"><div class="rule-note-title">✨ 黃金格</div>
        <div class="rule-note-body">經過或停在此格，可任意抽取一張牌卡</div></div>
        <div class="field-group"><div class="field-label">抽到的牌種</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${INFO_BTNS.map(t=>`<button onclick="updateRoll(${r.id},'goldenCardType','${gt===t.key?'':t.key}');updateRoll(${r.id},'cardName','');updateRoll(${r.id},'tarotGroup','');updateRoll(${r.id},'guideGroup','');renderPhaseContent()" style="padding:6px 14px;border-radius:20px;border:1.5px solid ${gt===t.key?t.c:'var(--border)'};background:${gt===t.key?t.bg:'transparent'};color:${gt===t.key?t.c:'var(--text-muted)'};font-size:12px;cursor:pointer;">${t.label}</button>`).join('')}
          </div>
        </div>${cardSel}`;
    }

    if (r.cellType === 'issue') {
      return `<div class="field-group"><div class="field-label">牌卡名稱</div>
        <select onchange="updateRoll(${r.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${CARD_OPTIONS['issue'].map(o=>`<option value="${o}" ${r.cardName===o?'selected':''}>${o}</option>`).join('')}
        </select></div>`;
    }

    if (r.cellType === 'tarot' || r.cellType === 'tarot-minor') {
      const isTarotMinor = r.cellType === 'tarot-minor';
      const groupSelect = isTarotMinor ? `<div class="field-group"><div class="field-label">牌組</div>
        <div class="suit-btns">
          ${TAROT_MINOR_GROUPS.map(g=>`<button class="suit-btn ${r.tarotGroup===g.name?'active':''}" onclick="updateRoll(${r.id},'tarotGroup','${r.tarotGroup===g.name?'':g.name}');renderPhaseContent()">
            <span class="suit-icon">${g.icon}</span><span class="suit-name">${g.suit}</span>
          </button>`).join('')}
        </div></div>` : '';
      const groupCards = isTarotMinor
        ? (r.tarotGroup ? TAROT_MINOR_GROUPS.find(g=>g.name===r.tarotGroup)?.cards||[] : [])
        : CARD_OPTIONS['tarot'];
      const cardSelect = (!isTarotMinor||r.tarotGroup) ? `<div class="field-group"><div class="field-label">牌卡名稱</div>
        <select onchange="updateRoll(${r.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${groupCards.map(o=>`<option value="${o}" ${r.cardName===o?'selected':''}>${o}</option>`).join('')}
        </select></div>` : '';
      return `${groupSelect}${cardSelect}
        <div class="field-group"><div class="field-label">正 / 逆位</div>
          <div class="orient-btns">
            <button class="orient-btn ${r.orientation==='正位'?'active':''}" data-val="正位" onclick="selectOrient(${r.id},'正位')">正位</button>
            <button class="orient-btn ${r.orientation==='逆位'?'active':''}" data-val="逆位" onclick="selectOrient(${r.id},'逆位')">逆位</button>
          </div></div>`;
    }

    if (r.cellType === 'guide') {
      const gg = r.guideGroup || '';
      const groupCards = gg ? GUIDE_GROUPS.find(g=>g.name===gg)?.cards || [] : [];
      return `<div class="field-group"><div class="field-label">元素</div>
        <div class="suit-btns">
          ${GUIDE_GROUPS.map(g=>`<button class="suit-btn ${gg===g.name?'active':''}" onclick="updateRoll(${r.id},'guideGroup','${gg===g.name?'':g.name}');renderPhaseContent()">
            <span class="suit-icon">${g.icon}</span><span class="suit-name">${g.suit||g.name.replace(/[🌬️💧🔥🌿\s]/g,'').slice(0,2)}</span>
          </button>`).join('')}
        </div></div>
        ${gg ? `<div class="field-group"><div class="field-label">牌卡名稱</div>
          <select onchange="updateRoll(${r.id},'cardName',this.value)">
            <option value="">— 選擇 —</option>
            ${groupCards.map(c=>`<option value="${c}" ${r.cardName===c?'selected':''}>${c}</option>`).join('')}
          </select></div>` : ''}`;
    }
    return '';
  })();

  // ── 附加事件 ──
  const extras = r.extras || [];
  const extraHTML = extras.length > 0 ? `
    <div class="extra-section">
      ${extras.map((ex, ei) => renderExtra(r, ex, ei)).join('')}
    </div>` : '';

  const isCollapsed = r.collapsed === true;

  return `<div class="roll-entry ${isCollapsed?'collapsed':''} ${r.isExtra?'extra-roll':''}" id="roll-${r.id}">
    <div class="roll-header" onclick="toggleRoll(${r.id})">
      <div class="roll-meta">
        <span class="roll-num">${r.isExtra ? '✦ 附加' : '第 '+idx+' 輪'}</span>
        <span class="cell-badge ${badgeCls}">${badgeLabel}</span>
        ${r.cardName ? `<span style="font-size:12px;color:var(--text-dim)">${r.cardName}${r.orientation?' '+r.orientation:''}</span>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="collapse-arrow">${isCollapsed?'›':'⌄'}</span>
        <button class="del-btn" onclick="event.stopPropagation();deleteRoll(${r.id})">×</button>
      </div>
    </div>
    <div class="roll-body" ${isCollapsed?'style="display:none"':''}>
      <div class="field-group">
        <div class="field-label">停在哪個格子</div>
        <div class="ct-btns">
          ${(r.isExtra ? CELL_TYPES.filter(c=>['destiny','noble','release','golden'].includes(c.key)).sort((a,b)=>['destiny','noble','release','golden'].indexOf(a.key)-['destiny','noble','release','golden'].indexOf(b.key)) : CELL_TYPES).map(c => {
            const active = r.cellType === c.key ? 'active '+(CELL_CLASS[c.key]||c.key) : '';
            return `<button class="ct-btn ${active}" onclick="selectCellType(${r.id},'${c.key}')">${c.label}</button>`;
          }).join('')}
        </div>
      </div>
      ${cardField}
      ${(()=>{
        const img = getCardImg(r.cardName, r.orientation);
        if (!img || !r.cardName) return '';
        const ct = CELL_TYPES.find(c=>c.key===r.cellType);
        return `<div class="card-img-wrap">
          <img class="card-img-thumb" src="${img}" alt="${r.cardName}">
          <div class="card-img-info">
            <div class="card-img-name">${r.cardName}</div>
            ${r.orientation ? `<div class="card-img-orient">${r.orientation}</div>` : ''}
            ${ct ? `<div class="card-img-type">${ct.label}</div>` : ''}
          </div>
        </div>`;
      })()}
      <div class="field-group">
        <div class="field-label">當下感受 / 備註</div>
        <textarea placeholder="這一步的感受或觀察…" oninput="updateRoll(${r.id},'note',this.value)">${r.note}</textarea>
      </div>
      ${extraHTML}
      <div class="roll-save-row">
        ${r.collapsed
          ? `<button class="roll-confirm-btn" onclick="confirmEdit(${r.id})">確認修改</button>
             <button class="roll-cancel-btn" onclick="cancelEdit(${r.id})">取消</button>`
          : `<button class="roll-save-btn" onclick="saveRoll(${r.id})">儲存這一輪</button>`
        }
      </div>
    </div>
  </div>`;
}

// ── ROLL ACTIONS ──
function toggleRoll(id) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.collapsed = !r.collapsed; break; }
  }
  renderPhaseContent();
}

function confirmEdit(id) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.collapsed = true; break; }
  }
  autoSave();
  renderPhaseContent();
  updateHandBar();
  showToast('已更新');
}

function cancelEdit(id) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.collapsed = true; break; }
  }
  renderPhaseContent();
}

function setPhaseToHand() {
  // 手牌 tab — 切換到手牌頁
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-hand')?.classList.add('active');
  hideFab();
  const hs = document.getElementById('headerStatus');
  if (hs) hs.innerHTML = '';
  const player = getPlayer();
  if (!player) return;
  document.getElementById('mainContent').innerHTML = renderHandPageHTML(player);
}

function renderHandPageHTML(player) {
  let html = '<div class="hand-page">';
  PHASES.forEach(ph => {
    const rolls = player.phases[ph];
    // 所有拿過的訊息牌都顯示；已放下的變灰
    const infoRolls = rolls.filter(r => isInfoRoll(r) && r.collapsed);
    const handIds = new Set(activeInfoRolls(rolls).map(r => r.id));
    const nobles = rolls.filter(r => isNobleCard(r) && r.collapsed);
    const rc = releaseCounts(rolls.filter(r => r.collapsed));

    if (!infoRolls.length && !nobles.length && !rc.cards) return;
    const phaseName = PHASE_NAMES[ph];
    const releaseNote = rc.cards ? `　·　放下 ${rc.cards} 次（已執行 ${Math.min(rc.done, rc.cards)}）` : '';
    html += `<div>
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">${phaseName} 關${releaseNote}</div>
      <div class="hand-grid">
        ${infoRolls.map(r => {
          const img = getCardImg(r.cardName, r.orientation);
          const t = infoTypeOf(r);
          const cls = t==='tarot'||t==='tarot-minor' ? 'tarot-c' : t==='issue' ? 'issue-c' : t==='guide' ? 'guide-c' : 'golden-c';
          const bgMap = {'tarot-c':'linear-gradient(160deg,#e8d4b0,#c09050)','issue-c':'linear-gradient(160deg,#b8cce8,#6090c8)','guide-c':'linear-gradient(160deg,#c8b8e0,#9870c8)','golden-c':'linear-gradient(160deg,#f0dea0,#c8a030)'};
          const gone = !handIds.has(r.id);
          return `<div class="hand-card-item" style="${gone?'filter:grayscale(1);opacity:.4;':''}" onclick="showLightbox('${img||''}','${r.cardName||''}','${r.orientation||''}')">
            <div class="hand-card-img-wrap">
              ${img ? `<img src="${img}" alt="${r.cardName}">` : `<div class="hand-card-no-img" style="background:${bgMap[cls]||bgMap['tarot-c']}">${(r.cardName||'').slice(0,2)}</div>`}
            </div>
            <div class="hand-card-name">${r.cardName||''}${r.orientation?' '+r.orientation:''}${gone?'（已放下）':''}</div>
          </div>`;
        }).join('')}
        ${nobles.map(() => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div style="width:100%;aspect-ratio:2/3;border-radius:4px;background:#F0EDE6;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;">⚪</div>
          <div class="hand-card-name">貴人</div>
        </div>`).join('')}
        ${Array.from({length: rc.cards}).map((_, k) => { const used = k < rc.done; return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;${used?'opacity:.4;':''}">
          <div style="width:100%;aspect-ratio:2/3;border-radius:4px;background:${used?'#9A948C':'#2C2218'};border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;">⚫</div>
          <div class="hand-card-name">${used?'放下（已執行）':'放下'}</div>
        </div>`; }).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function showLightbox(imgUrl, name, orient) {
  if (!imgUrl) { showToast('此牌無圖片'); return; }
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.onclick = () => lb.remove();
  lb.innerHTML = `<img src="${imgUrl}" alt="${name}"><div class="lightbox-info">${name}${orient?' · '+orient:''}</div>`;
  document.body.appendChild(lb);
}

function newGame() {
  const m = document.createElement('div');
  m.id = 'newGameModal';
  m.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(44,34,24,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;';
  m.innerHTML = `<div style="background:var(--surface);border-radius:var(--radius);padding:24px 20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <div style="font-family:var(--font);font-size:15px;color:var(--text);letter-spacing:.04em;">開始新一場遊戲？</div>
    <div style="font-size:13px;color:var(--text-muted);line-height:1.6;">目前紀錄會自動存入歷史，之後可從首頁叫出。</div>
    <div style="display:flex;gap:8px;">
      <button onclick="document.getElementById('newGameModal').remove();_doNewGame()" style="flex:1;padding:12px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,#A07850,#7C5C38);color:#fff;font-size:14px;cursor:pointer;">確認</button>
      <button onclick="document.getElementById('newGameModal').remove()" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer;">取消</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

function _doNewGame() {
  archiveCurrentSession();
  localStorage.removeItem(LS_CURRENT);
  gameStarted = false;
  players = [];
  currentPhase = 'body';
  nextId = 1;
  window._sessionDate = new Date().toISOString().slice(0,10);
  hideFab();
  const ptb = document.getElementById('playerTabsBar');
  if (ptb) ptb.innerHTML = '';
  initPlayers(2);
  renderSetup();
}

function updateHandBar() {
  const bar = document.getElementById('handBar');
  if (!bar || !gameStarted) return;
  const player = getPlayer();
  if (!player) return;

  bar.innerHTML = '<span class="hand-bar-label">手牌</span>';

  // 只顯示當前關卡的牌
  const rolls = player.phases[currentPhase] || [];
  const handIds = new Set(activeInfoRolls(rolls).map(r => r.id));
  rolls.forEach(r => {
      // 訊息牌（已放下的變灰）
      if (isInfoRoll(r) && r.cardName) {
        const gone = !handIds.has(r.id);
        const img = getCardImg(r.cardName, r.orientation);
        const div = document.createElement('div');
        div.style.cssText = 'flex-shrink:0;width:32px;height:50px;border-radius:3px;overflow:hidden;box-shadow:0 2px 5px rgba(124,98,72,0.22);cursor:pointer;' + (gone ? 'filter:grayscale(1);opacity:.4;' : '');
        if (img) {
          div.innerHTML = `<img src="${img}" style="width:100%;height:100%;object-fit:cover;" alt="${r.cardName}">`;
        } else {
          const bg = infoTypeOf(r)==='issue'?'#8090c0':infoTypeOf(r)==='guide'?'#9070c0':'#c0a060';
          div.style.background = bg;
          div.style.display = 'flex';
          div.style.alignItems = 'center';
          div.style.justifyContent = 'center';
          div.style.fontSize = '9px';
          div.style.color = '#fff';
          div.style.textAlign = 'center';
          div.textContent = (r.cardName||'').slice(0,2);
        }
        div.title = r.cardName + (r.orientation?' '+r.orientation:'') + (gone?'（已放下）':'');
        div.onclick = () => showLightbox(img, r.cardName, r.orientation);
        bar.appendChild(div);
      }

      // 貴人 ⚪（附加貴人不算）
      if (isNobleCard(r)) {
        const t = document.createElement('div');
        t.style.cssText = 'flex-shrink:0;width:32px;height:50px;border-radius:3px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;';
        t.textContent = '⚪';
        t.title = '貴人卡';
        bar.appendChild(t);
      }

  });
  // 放下 ⚫：這關得到的每一張放下卡，已執行的變灰
  const rc = releaseCounts(rolls);
  for (let k = 0; k < rc.cards; k++) {
    const used = k < rc.done;
    const t = document.createElement('div');
    t.style.cssText = 'flex-shrink:0;width:32px;height:50px;border-radius:3px;background:' + (used ? '#9A948C' : '#2C2218') + ';display:flex;align-items:center;justify-content:center;font-size:18px;' + (used ? 'opacity:.4;' : '');
    t.textContent = '⚫';
    t.title = used ? '放下卡（已執行）' : '放下卡（未執行）';
    bar.appendChild(t);
  }
}

function saveRoll(id) {
  const player = getPlayer(); if (!player) return;
  // 判斷這是新增輪次還是編輯已存的（collapsed=true 的才是已存的）
  let wasCollapsed = false;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { wasCollapsed = r.collapsed; r.collapsed = true; break; }
  }
  updateHandBar();
  autoSave();
  const status = calcPassStatus(player, currentPhase);
  if (status.canPass) {
    saveCurrentSession();
    archiveCurrentSession();
    showPassModal(player, currentPhase, status);
  } else {
    renderPhaseContent();
  }
}

function showPassModal(player, phase, status) {
  const PHASE_NAMES = {body:'身', mind:'心', spirit:'靈'};
  const nextPhase = phase === 'body' ? 'mind' : phase === 'mind' ? 'spirit' : null;
  const passWay = status.passA ? '方式①（塔羅、議題、指引各1張＋貴人）' : '方式②（7張＋貴人）';

  const modal = document.createElement('div');
  modal.id = 'passModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;justify-content:center;background:rgba(44,34,24,0.5);backdrop-filter:blur(4px);';
  modal.innerHTML = `<div style="width:100%;max-width:480px;background:linear-gradient(160deg,#FDFCF9,#F7F2E8);border-radius:20px 20px 0 0;padding:28px 22px 36px;display:flex;flex-direction:column;gap:16px;">
    <div style="width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 4px;"></div>
    <div style="text-align:center;">
      <div style="font-size:28px;margin-bottom:8px;">✨</div>
      <div style="font-family:var(--font);font-size:18px;color:var(--text);letter-spacing:.06em;margin-bottom:6px;">「${PHASE_NAMES[phase]}」關達標</div>
      <div style="font-size:13px;color:var(--text-muted);">${passWay}</div>
    </div>
    <div style="background:linear-gradient(135deg,var(--pass-bg),#E4F2EA);border-radius:8px;padding:14px 16px;font-size:13px;color:var(--pass-c);line-height:1.8;">
      訊息卡 ${status.infoCount} 張 · 貴人卡 ${status.totalNobles} 張<br>
      你可以繼續停留（最多累積 9 張），或進入下一關。
    </div>
    ${nextPhase ? `
    <button onclick="goNextPhase('${nextPhase}')" style="width:100%;padding:14px;background:linear-gradient(135deg,#A07850,#7C5C38);border:none;border-radius:6px;color:#fff;font-size:15px;font-family:var(--font);letter-spacing:.08em;cursor:pointer;">
      進入「${PHASE_NAMES[nextPhase]}」關 →
    </button>` : `
    <button onclick="goNextPhase(null)" style="width:100%;padding:14px;background:linear-gradient(135deg,#7A58A0,#5A3880);border:none;border-radius:6px;color:#fff;font-size:15px;font-family:var(--font);letter-spacing:.08em;cursor:pointer;">
      前往答案藍圖 ✦
    </button>`}
    <button onclick="closePassModal()" style="width:100%;padding:12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:14px;cursor:pointer;letter-spacing:.04em;">
      繼續停留在「${PHASE_NAMES[phase]}」關
    </button>
  </div>`;
  document.body.appendChild(modal);
  // 自動新增下一輪（留在這關繼續）
  addRoll();
}

function closePassModal() {
  const m = document.getElementById('passModal');
  if (m) m.remove();
}

function goNextPhase(next) {
  closePassModal();
  const player = getPlayer();
  if (player) player.phaseDone[currentPhase] = true;
  if (next) {
    if (player) player.nobleCarry[next] = calcNobleCarryForward(player, currentPhase);
    setPhase(next);
  } else {
    setPhase('blueprint');
  }
}

function addRoll() {
  const player = getPlayer();
  if (!player) return;
  // collapse all previous rolls in this phase
  player.phases[currentPhase].forEach(r => { r.collapsed = true; });
  player.phases[currentPhase].push({
    id: nextId++, dice: null, cellType:'', cardName:'', orientation:'', tarotGroup:'', note:'', extras:[], collapsed: false
  });
  renderPhaseContent();
  setTimeout(() => { const a = document.getElementById('scrollArea'); a.scrollTop = a.scrollHeight; }, 60);
}

function deleteRoll(id) {
  const player = getPlayer();
  if (!player) return;
  player.phases[currentPhase] = player.phases[currentPhase].filter(r => r.id !== id);
  renderPhaseContent();
}

function updateRoll(id, field, val) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r[field] = val; break; }
  }
  updateDots();
  if (field === 'cardName') updateHandBar();
}

function selectCellType(id, key) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) {
      const prev = r.cellType;
      r.cellType = (prev === key) ? '' : key;
      if (prev !== r.cellType) { r.cardName = ''; r.orientation = ''; }
      break;
    }
  }
  renderPhaseContent();
}

function selectOrient(id, val) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.orientation = (r.orientation === val) ? '' : val; break; }
  }
  const btns = document.querySelectorAll(`#roll-${id} .orient-btn`);
  btns.forEach(b => b.classList.toggle('active', b.dataset.val === (() => {
    for (const ph of PHASES) { const r = getPlayer()?.phases[ph].find(r => r.id === id); if (r) return r.orientation; } return '';
  })()));
}

function dismissAi(id) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.aiResult = null; break; }
  }
  renderPhaseContent();
}

// ── PHOTO ──

function addExtra(rollId, type) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r=>r.id===rollId);
    if (r) {
      if (!r.extras) r.extras=[];
      r.extras.push({id:nextId++,type,cardName:'',orientation:'',destinyWinner:'',noblePerson:'',nobleRole:'',nobleDice:'',releasedCard:'',destinyCardType:''});
      r.collapsed = false;
      break;
    }
  }
  renderPhaseContent();
  setTimeout(() => {
    const el = document.getElementById('roll-' + rollId);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 60);
}

function removeExtra(rollId, extraId) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r=>r.id===rollId);
    if (r) { r.extras = (r.extras||[]).filter(e=>e.id!==extraId); break; }
  }
  renderPhaseContent();
}

function updateExtra(rollId, extraId, field, val) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r=>r.id===rollId);
    if (r) { const ex = (r.extras||[]).find(e=>e.id===extraId); if (ex) ex[field]=val; break; }
  }
  updateDots();
}

function updateExtraAndRefresh(rollId, extraId, field, val) {
  updateExtra(rollId, extraId, field, val);
  renderPhaseContent();
}

function renderExtra(r, ex, ei) {
  const playerOpts = players.map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${ex.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('');
  const othersOpts = players.filter(p=>p.id!==currentPlayerId).map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${ex.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('');
  const allCardSel = (field) => `<select onchange="updateExtra(${r.id},${ex.id},'${field}',this.value)">
    <option value="">— 選擇 —</option>
    <optgroup label="探索">${CARD_OPTIONS['tarot'].map(o=>`<option value="${o}" ${ex[field]===o?'selected':''}>${o}</option>`).join('')}</optgroup>
    <optgroup label="真相">${TAROT_MINOR_GROUPS.map(g=>`<optgroup label="${g.icon} ${g.suit}">${g.cards.map(c=>`<option value="${c}" ${ex[field]===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}</optgroup>
    <optgroup label="議題">${CARD_OPTIONS['issue'].map(o=>`<option value="${o}" ${ex[field]===o?'selected':''}>${o}</option>`).join('')}</optgroup>
    <optgroup label="指引">${GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${ex[field]===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}</optgroup>
  </select>`;

  let body = '';
  if (ex.type === 'destiny') {
    const DESTINY_TYPES = [
      {key:'issue',label:'議題',icon:'🔵'},
      {key:'tarot-minor',label:'真相',icon:'🟠'},
      {key:'tarot',label:'探索',icon:'⭐'},
      {key:'guide',label:'指引',icon:'🟢'},
    ];
    const dt = ex.destinyCardType || '';
    const cardOpts = (() => {
      if (!dt) return '';
      if (dt === 'guide') {
        return `<div class="field-group"><div class="field-label">牌卡名稱</div><select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${ex.cardName===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
        </select></div>`;
      }
      if (dt === 'tarot-minor') {
        return `<div class="field-group"><div class="field-label">牌卡名稱</div><select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${TAROT_MINOR_GROUPS.map(g=>`<optgroup label="${g.icon} ${g.suit}">${g.cards.map(c=>`<option value="${c}" ${ex.cardName===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
        </select></div>`;
      }
      const opts = CARD_OPTIONS[dt] || [];
      return `<div class="field-group"><div class="field-label">牌卡名稱</div><select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
        <option value="">— 選擇 —</option>
        ${opts.map(o=>`<option value="${o}" ${ex.cardName===o?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
    })();
    body = `<div class="field-group"><div class="field-label">① 牌種</div>
      <div class="suit-btns" style="flex-wrap:wrap;">
        ${DESTINY_TYPES.map(t=>`<button class="suit-btn ${dt===t.key?'active':''}" onclick="updateExtraAndRefresh(${r.id},${ex.id},'destinyCardType','${dt===t.key?'':t.key}')" style="width:60px;">
          <span class="suit-icon">${t.icon}</span><span class="suit-name">${t.label}</span>
        </button>`).join('')}
      </div></div>
      ${cardOpts}
      <div class="field-group"><div class="field-label">② 得牌玩家</div>
        <select onchange="updateExtra(${r.id},${ex.id},'destinyWinner',this.value)">
          <option value="">— 選擇玩家 —</option>
          ${playerOpts}
        </select>
      </div>`;
  } else if (ex.type === 'noble') {
    body = '';
    if (true) { ex.nobleRole = 'receiver'; {
      body += `<div class="field-group"><div class="field-label">貴人是誰</div>
        <select onchange="updateExtra(${r.id},${ex.id},'noblePerson',this.value)"><option value="">— 選擇 —</option>${othersOpts}</select></div>
      <div class="field-group"><div class="field-label">貴人骰骰到</div>
        <select onchange="updateExtraAndRefresh(${r.id},${ex.id},'nobleDice',this.value)">
          <option value="">— 選擇 —</option>
          <option value="release" ${ex.nobleDice==='release'?'selected':''}>放下</option>
          <option value="destiny" ${ex.nobleDice==='destiny'?'selected':''}>命運之輪</option>
          <option value="issue"   ${ex.nobleDice==='issue'?'selected':''}>議題</option>
          <option value="tarot-minor" ${ex.nobleDice==='tarot-minor'?'selected':''}>真相</option>
          <option value="tarot"   ${ex.nobleDice==='tarot'?'selected':''}>探索</option>
          <option value="guide"   ${ex.nobleDice==='guide'?'selected':''}>指引</option>
        </select></div>
      ${ex.nobleDice && ex.nobleDice!=='release' && ex.nobleDice!=='destiny' ? `
        <div class="field-group"><div class="field-label">得到的牌卡</div>
          <select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
            <option value="">— 選擇 —</option>
            ${ex.nobleDice==='guide'
              ? GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${ex.cardName===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')
              : (CARD_OPTIONS[ex.nobleDice]||[]).map(o=>`<option value="${o}" ${ex.cardName===o?'selected':''}>${o}</option>`).join('')}
          </select></div>` : ''}`;
    }}
  } else if (ex.type === 'release') {
    // 計算這個關卡目前收到的訊息牌
    const player = getPlayer();
    const phRolls = player ? player.phases[currentPhase] : [];
    const infoRolls = phRolls.filter(roll => INFO_CELLS.includes(roll.cellType) && roll.cardName);
    // 計算放下卡數量（主格子 + 附加事件）
    const releaseCount = phRolls.reduce((acc, roll) => {
      if (roll.cellType === 'release') acc++;
      (roll.extras||[]).forEach(e => { if (e.type === 'release') acc++; });
      return acc;
    }, 0);
    // 已放下的（其他附加事件中）
    const alreadyReleased = phRolls.flatMap(roll =>
      (roll.extras||[]).filter(e => e.type === 'release' && e.id !== ex.id && e.releasedCard).map(e => e.releasedCard)
    );
    const availableCards = infoRolls.filter(roll => !alreadyReleased.includes(roll.cardName));
    body = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">放下卡數：${releaseCount} 張，可放下 ${releaseCount} 張訊息牌</div>
    <div class="field-group"><div class="field-label">選擇要放下的牌</div>
      <select onchange="updateExtra(${r.id},${ex.id},'releasedCard',this.value)">
        <option value="">— 選擇 —</option>
        ${availableCards.map(roll=>`<option value="${roll.cardName}" ${ex.releasedCard===roll.cardName?'selected':''}>${roll.cardName}（${CELL_TYPES.find(c=>c.key===roll.cellType)?.label||''}）</option>`).join('')}
        ${infoRolls.length===0?'<option disabled>— 尚無訊息牌可放下 —</option>':''}
      </select>
    </div>`;
  } else if (ex.type === 'golden') {
    body = `<div style="font-size:12px;color:#92680a;margin-bottom:4px">經過或停在此格，可任意抽取一張牌卡</div>
    <div class="field-group"><div class="field-label">抽到的牌卡</div>
      ${allCardSel('cardName')}
    </div>`;
  }

  const labels = {destiny:'🎡 命運之輪', noble:'⭐ 貴人', release:'🍃 放下牌', golden:'✨ 黃金格'};
  return `<div class="extra-card">
    <div class="extra-card-hd">
      <span class="extra-card-label">${labels[ex.type]||ex.type}</span>
      <button class="del-btn" onclick="removeExtra(${r.id},${ex.id})">×</button>
    </div>
    <div class="extra-card-body">${body}</div>
  </div>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── DRAWER ──
function openDrawer() {
  renderDrawer();
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function renderDrawer() {
  if (!gameStarted) {
    document.getElementById('drawerBody').innerHTML = '<div class="empty-state">遊戲尚未開始</div>';
    return;
  }
  const player = getPlayer();
  const playerSelect = `<div class="field-group"><div class="field-label">查看玩家</div>
    <select onchange="switchPlayerDrawer(parseInt(this.value))">
      ${players.map(p=>`<option value="${p.id}" ${p.id===currentPlayerId?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('')}
    </select></div>`;

  const summaryHTML = PHASES.map(ph => {
    const rolls = player.phases[ph];
    const status = calcPassStatus(player, ph);
    return `<div class="scard">
      <div class="scard-hd ${ph}"><span>${PHASE_NAMES[ph]} 關</span>
        <span style="font-size:12px;opacity:.7">${status.infoCount} 張訊息卡 ${status.canPass?'· ✅':''}${status.atLimit?'· 已達上限':''}</span>
      </div>
      <div class="scard-bd">
        ${rolls.length===0?'<span style="font-size:12px;color:var(--text-dim);font-style:italic">尚未記錄</span>':rolls.map((r,i)=>{
          const ct = CELL_TYPES.find(c=>c.key===r.cellType);
          return `<div class="scard-row"><span class="scard-idx">#${i+1}</span><span>${ct?ct.label:'—'}${r.cardName?' · '+r.cardName:''}${r.orientation?' '+r.orientation:''}</span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('drawerBody').innerHTML = `<div class="info-section">
    ${playerSelect}
    <div><div class="info-label" style="margin-bottom:8px">遊戲進度</div><div class="summary-grid">${summaryHTML}</div></div>
    <div class="field-group">
      <div class="info-label" style="margin-bottom:4px">遊戲結語</div>
      <div class="field-label" style="margin-bottom:5px">核心啟發</div>
      <textarea rows="3" placeholder="這場遊戲給你的啟發…" oninput="getPlayer().insight=this.value">${player.insight||''}</textarea>
      <div class="field-label" style="margin-top:8px;margin-bottom:5px">你打算如何實踐？</div>
      <textarea rows="3" placeholder="具體行動或心態調整…" oninput="getPlayer().action=this.value">${player.action||''}</textarea>
    </div>
    <div><div class="info-label" style="margin-bottom:8px">匯出</div>
      <div class="export-btns">
        <button class="export-btn primary" onclick="exportForAI()">複製 AI 分析文字</button>
        <button class="export-btn" onclick="exportZip()">下載 ZIP（含照片）</button>
      </div>
    </div>
  </div>`;

  document.getElementById('drawerBody').querySelector('select') &&
    document.getElementById('drawerBody').querySelectorAll('textarea').forEach((ta, i) => {
      if (i===0) ta.addEventListener('input', e => { getPlayer().insight = e.target.value; });
      if (i===1) ta.addEventListener('input', e => { getPlayer().action = e.target.value; });
    });
}

function switchPlayerDrawer(id) {
  applyPlayerSwitch(id);
  renderPlayerTabs();
  renderPhaseContent();
  renderDrawer();
}

// ── EXPORT ──
function exportForAI() {
  const player = getPlayer();
  let text = `# 《答案》桌遊遊玩紀錄\n\n**玩家**：${player.name||'玩家'+(player.id+1)}\n**議題**：${player.topic||'（未填）'}\n\n---\n\n`;
  PHASES.forEach(ph => {
    const rolls = player.phases[ph];
    const status = calcPassStatus(player, ph);
    text += `## ${PHASE_NAMES[ph]} 關（${status.infoCount} 張訊息卡）\n\n`;
    if (!rolls.length) { text += '（無記錄）\n\n'; return; }
    rolls.forEach((r,i) => {
      const ct = CELL_TYPES.find(c=>c.key===r.cellType);
      text += `### 第 ${i+1} 輪\n`;
      text += `- 格子：${ct?ct.label:'—'}\n`;
      if (r.cardName) text += `- 牌卡：${r.cardName}${r.orientation?' ('+r.orientation+')':''}\n`;
      if (r.note) text += `- 感受：${r.note}\n`;
      text += '\n';
    });
  });
  text += `---\n\n## 答案藍圖\n\n`;
  if (player.blueprint) {
    PHASES.forEach(ph => {
      const bp = player.blueprint[ph] || {};
      const parts = [];
      if (bp.tarotId) parts.push(`塔羅 ${bp.tarotId}${bp.tarotOrientation?' '+bp.tarotOrientation:''}`);
      if (bp.issueId) parts.push(`議題 ${bp.issueId}`);
      if (bp.guideId) parts.push(`指引 ${bp.guideId}`);
      text += `**${PHASE_NAMES[ph]}**：${parts.join('、')||'未完成'}\n`;
    });
  }
  if (player.insight) text += `\n## 核心啟發\n\n${player.insight}\n`;
  if (player.action) text += `\n## 實踐計畫\n\n${player.action}\n`;
  text += `\n---\n\n請根據以上《答案》桌遊完整紀錄，依身（行動層）、心（情感層）、靈（靈魂層）三個維度整合解讀，對照議題「${player.topic||'（未填）'}」給出洞察與建議。`;
  navigator.clipboard.writeText(text).then(()=>showToast('已複製！'));
}

async function exportZip() {
  showToast('打包中…');
  const zip = new JSZip();
  const allData = { exportTime: new Date().toISOString(), players: players.map(p => {
    const phases = {};
    PHASES.forEach(ph => { phases[ph] = p.phases[ph].map(r => { const {photo,...rest} = r; return rest; }); });
    return { id:p.id, name:p.name, zodiac:p.zodiac, topic:p.topic, phases, blueprint:p.blueprint, insight:p.insight, action:p.action };
  })};
  zip.file('紀錄.json', JSON.stringify(allData, null, 2));
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `答案紀錄_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.zip`;
  a.click();
  showToast('已下載');
}

// ── LOCAL STORAGE ──
const LS_KEY = 'sofasogood_sessions';
const LS_CURRENT = 'sofasogood_current';

function saveCurrentSession() {
  try {
    const data = {
      date: window._sessionDate || new Date().toISOString().slice(0,10),
      savedAt: Date.now(),
      players, currentPlayerId, currentPhase, nextId
    };
    localStorage.setItem(LS_CURRENT, JSON.stringify(data));
  } catch(e) {}
}

function loadCurrentSession() {
  try {
    const raw = localStorage.getItem(LS_CURRENT);
    if (!raw) return false;
    const data = JSON.parse(raw);
    players = data.players || [];
    currentPlayerId = data.currentPlayerId || 0;
    currentPhase = data.currentPhase || 'body';
    nextId = data.nextId || 1;
    window._sessionDate = data.date || new Date().toISOString().slice(0,10);
    return true;
  } catch(e) { return false; }
}

function archiveCurrentSession() {
  try {
    const raw = localStorage.getItem(LS_CURRENT);
    if (!raw) return;
    const data = JSON.parse(raw);
    const all = loadAllSessions();
    // 用 date+savedAt 做唯一 key，避免重複
    const id = data.date + '_' + (data.savedAt || Date.now());
    const existing = all.findIndex(s => s.id === id);
    if (existing >= 0) all[existing] = {...data, id};
    else all.unshift({...data, id});
    // 最多保留 30 場
    localStorage.setItem(LS_KEY, JSON.stringify(all.slice(0, 30)));
  } catch(e) {}
}

function loadAllSessions() {
  try {
    return JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  } catch(e) { return []; }
}

function autoSave() {
  if (gameStarted) saveCurrentSession();
}

function showHistory() {
  const sessions = loadAllSessions();
  if (!sessions.length) { showToast('尚無歷史紀錄'); return; }

  // 按日期分組
  const byDate = {};
  sessions.forEach(s => {
    const d = s.date || '未知日期';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(s);
  });

  const modal = document.createElement('div');
  modal.id = 'historyModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;background:rgba(44,34,24,0.5);backdrop-filter:blur(4px);';

  let rows = '';
  Object.entries(byDate).sort((a,b) => b[0].localeCompare(a[0])).forEach(([date, sessions]) => {
    const d = new Date(date);
    const label = d.toLocaleDateString('zh-TW', {month:'long', day:'numeric', weekday:'short'});
    rows += `<div style="font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;padding:10px 0 6px;">${label}</div>`;
    sessions.forEach(s => {
      const names = (s.players||[]).map(p=>p.name||'玩家'+(p.id+1)).join('、');
      const time = s.savedAt ? new Date(s.savedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';
      rows += `<div onclick="loadSession('${s.id}')" style="background:linear-gradient(160deg,#FDFCF9,#FAF7F0);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:14px;color:var(--text);margin-bottom:3px;">${names}</div>
          <div style="font-size:11px;color:var(--text-muted);">${time} · ${(s.players||[]).length} 位玩家</div>
        </div>
        <span style="color:var(--text-dim);font-size:14px;">›</span>
      </div>`;
    });
  });

  modal.innerHTML = `<div style="width:100%;max-width:480px;background:linear-gradient(160deg,#FDFCF9,#F7F2E8);border-radius:20px 20px 0 0;padding:20px 18px 32px;max-height:80vh;display:flex;flex-direction:column;gap:0;" onclick="event.stopPropagation()">
    <div style="width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 12px;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-family:var(--font);font-size:16px;color:var(--text);">歷史紀錄</div>
      <button onclick="document.getElementById('historyModal').remove()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;">×</button>
    </div>
    <div style="overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;">${rows}</div>
    <button onclick="if(confirm('確定要清除所有歷史紀錄？')){localStorage.removeItem('${LS_KEY}');localStorage.removeItem('${LS_CURRENT}');document.getElementById('historyModal').remove();showToast('已清除');}" style="margin-top:12px;width:100%;padding:10px;border-radius:var(--radius);border:1px solid var(--border);background:none;color:var(--text-dim);font-size:13px;cursor:pointer;">清除所有紀錄</button>
  </div>`;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
}

function loadSession(id) {
  const all = loadAllSessions();
  const s = all.find(x => x.id === id);
  if (!s) return;
  players = s.players || [];
  currentPlayerId = s.currentPlayerId || 0;
  currentPhase = s.currentPhase || 'body';
  nextId = s.nextId || 1;
  window._sessionDate = s.date || '';
  gameStarted = true;
  document.getElementById('historyModal')?.remove();
  renderPlayerTabs();
  renderPhaseContent();
  showFab();
  showToast('已載入紀錄');
}

// ── INIT ──
// 自動載入上次紀錄
if (loadCurrentSession() && players.length > 0 && players.some(p => PHASES.some(ph => p.phases[ph].length > 0))) {
  gameStarted = true;
  renderPlayerTabs();
  renderPhaseContent();
  showFab();
} else {
  initPlayers(2);
  renderSetup();
}

// 每 5 秒自動存一次
setInterval(autoSave, 5000);
</script>
